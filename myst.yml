version: 1

# Branding
extends:
  # choose between c3s.yml, cams.yml, and ecmwf.yml
  - branding/c3s.yml

project:
  title: C3S Training Insitu Observations Submodule
  license: Apache-2.0
  open_access: true
  exclude:
    - developer/*
  github: ecmwf-training/jupyter-template
  thebe:
    binder:
      repo: ecmwf-training/jupyter-template
      provider: github
      url: https://mybinder.org
      ref: develop
  exports:
    - format: pdf
      template: plain_latex_book
      output: exports/book.pdf
  toc:
    - file: intro.md
    - title: README instructions
      file: README.md
    - file: template-notebook.ipynb
    - file: eobs_multiple_variables.ipynb
    - file: GRUAN_C3S_Jupyter.ipynb
    - file: eprofile_wind_profiler_analysis.ipynb
site:
  template: book-theme
  options:
    folders: true
